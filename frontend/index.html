<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Placement & Salary Predictor</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 22px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: block; font-size: 13px; margin-bottom: 4px; color: #444; }
  input, select { width: 100%; padding: 6px; box-sizing: border-box; margin-bottom: 10px; }
  button { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 4px;
           font-size: 15px; cursor: pointer; margin-top: 10px; }
  button:hover { background: #1d4ed8; }
  #result { margin-top: 20px; padding: 16px; border-radius: 6px; display: none; }
  #result.placed { background: #dcfce7; border: 1px solid #16a34a; }
  #result.not-placed { background: #fee2e2; border: 1px solid #dc2626; }
  #result h2 { margin-top: 0; font-size: 18px; }
  #error { color: #dc2626; margin-top: 10px; display: none; white-space: pre-wrap; }
</style>
</head>
<body>

<h1>AI-Powered Placement and Salary Predictor</h1>
<p style="font-size:13px;color:#666">
  Connected to: <code id="apiUrlDisplay"></code>
</p>

<form id="predictForm">
  <div class="grid">
    <div><label>Age</label><input type="number" id="age" min="18" max="30" value="21" required></div>
    <div><label>Gender</label>
      <select id="gender"><option>Male</option><option>Female</option></select>
    </div>
    <div><label>CGPA</label><input type="number" step="0.01" min="0" max="10" id="cgpa" value="8.0" required></div>
    <div><label>Branch</label>
      <select id="branch">
        <option>CSE</option><option>IT</option><option>ECE</option>
        <option>EEE</option><option>Mechanical</option><option>Civil</option>
      </select>
    </div>
    <div><label>College Tier</label>
      <select id="college_tier"><option>Tier 1</option><option>Tier 2</option><option>Tier 3</option></select>
    </div>
    <div><label>Backlogs</label><input type="number" id="backlogs" min="0" max="10" value="0" required></div>
    <div><label>Internships</label><input type="number" id="internships_count" min="0" max="10" value="1" required></div>
    <div><label>Projects</label><input type="number" id="projects_count" min="0" max="20" value="3" required></div>
    <div><label>Certifications</label><input type="number" id="certifications_count" min="0" max="20" value="2" required></div>
    <div><label>Hackathons</label><input type="number" id="hackathons_participated" min="0" max="20" value="1" required></div>
    <div><label>GitHub Repos</label><input type="number" id="github_repos" min="0" max="100" value="3" required></div>
    <div><label>LinkedIn Connections</label><input type="number" id="linkedin_connections" min="0" max="2000" value="150" required></div>
    <div><label>Coding Skill Score</label><input type="number" step="0.1" min="0" max="100" id="coding_skill_score" value="75" required></div>
    <div><label>Aptitude Score</label><input type="number" step="0.1" min="0" max="100" id="aptitude_score" value="70" required></div>
    <div><label>Communication Score</label><input type="number" step="0.1" min="0" max="100" id="communication_skill_score" value="70" required></div>
    <div><label>Logical Reasoning Score</label><input type="number" step="0.1" min="0" max="100" id="logical_reasoning_score" value="70" required></div>
    <div><label>Mock Interview Score</label><input type="number" step="0.1" min="0" max="100" id="mock_interview_score" value="75" required></div>
    <div><label>Attendance %</label><input type="number" step="0.1" min="0" max="100" id="attendance_percentage" value="85" required></div>
    <div><label>Extracurricular Score</label><input type="number" step="0.1" min="0" max="100" id="extracurricular_score" value="60" required></div>
    <div><label>Leadership Score</label><input type="number" step="0.1" min="0" max="100" id="leadership_score" value="55" required></div>
    <div><label>Volunteer Experience</label>
      <select id="volunteer_experience"><option>Yes</option><option>No</option></select>
    </div>
    <div><label>Sleep Hours</label><input type="number" step="0.1" min="0" max="24" id="sleep_hours" value="7" required></div>
    <div><label>Study Hours / Day</label><input type="number" step="0.1" min="0" max="24" id="study_hours_per_day" value="3" required></div>
  </div>
  <button type="submit">Predict</button>
</form>

<div id="error"></div>
<div id="result"></div>

<script>
// ── Single source of truth for the backend URL ──
// Update ONLY this line if the deployment URL ever changes.
const API_BASE_URL = 'https://placement-predictor-amber.vercel.app';

document.getElementById('apiUrlDisplay').textContent = API_BASE_URL;

document.getElementById('predictForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const errorDiv = document.getElementById('error');
  const resultDiv = document.getElementById('result');
  errorDiv.style.display = 'none';
  resultDiv.style.display = 'none';

  const payload = {
    age: parseInt(document.getElementById('age').value),
    gender: document.getElementById('gender').value,
    cgpa: parseFloat(document.getElementById('cgpa').value),
    branch: document.getElementById('branch').value,
    college_tier: document.getElementById('college_tier').value,
    internships_count: parseInt(document.getElementById('internships_count').value),
    projects_count: parseInt(document.getElementById('projects_count').value),
    certifications_count: parseInt(document.getElementById('certifications_count').value),
    coding_skill_score: parseFloat(document.getElementById('coding_skill_score').value),
    aptitude_score: parseFloat(document.getElementById('aptitude_score').value),
    communication_skill_score: parseFloat(document.getElementById('communication_skill_score').value),
    logical_reasoning_score: parseFloat(document.getElementById('logical_reasoning_score').value),
    hackathons_participated: parseInt(document.getElementById('hackathons_participated').value),
    github_repos: parseInt(document.getElementById('github_repos').value),
    linkedin_connections: parseInt(document.getElementById('linkedin_connections').value),
    mock_interview_score: parseFloat(document.getElementById('mock_interview_score').value),
    attendance_percentage: parseFloat(document.getElementById('attendance_percentage').value),
    backlogs: parseInt(document.getElementById('backlogs').value),
    extracurricular_score: parseFloat(document.getElementById('extracurricular_score').value),
    leadership_score: parseFloat(document.getElementById('leadership_score').value),
    volunteer_experience: document.getElementById('volunteer_experience').value,
    sleep_hours: parseFloat(document.getElementById('sleep_hours').value),
