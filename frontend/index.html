<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placement Predictor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 2px 2px 12px rgba(0, 0, 0, 0.1);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0056b3;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

  <h2>Placement Predictor</h2>
  <form id="predictorForm">
    <div class="form-group">
      <label for="cgpa">CGPA:</label>
      <input type="number" step="0.01" id="cgpa" required placeholder="e.g. 8.5">
    </div>
    <div class="form-group">
      <label for="iq">IQ:</label>
      <input type="number" id="iq" required placeholder="e.g. 110">
    </div>
    <button type="submit">Predict Placement</button>
  </form>

  <div id="result"></div>

  <script>
    const API_URL = 'https://placement-predictor-oyxh.onrender.com/predict';

    document.getElementById('predictorForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      
      const cgpa = parseFloat(document.getElementById('cgpa').value);
      const iq = parseInt(document.getElementById('iq').value);
      const resultDiv = document.getElementById('result');

      resultDiv.innerText = 'Predicting...';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ cgpa: cgpa, iq: iq })
        });

        if (!response.ok) {
          throw new Error('Failed to fetch prediction');
        }

        const data = await response.json();
        resultDiv.innerText = `Prediction: ${data.prediction || data.result}`;
      } catch (error) {
        console.error('Error:', error);
        resultDiv.innerText = 'Error making prediction. Check console or CORS settings.';
      }
    });
  </script>

</body>
</html>
